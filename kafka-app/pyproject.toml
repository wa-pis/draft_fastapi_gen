[project]
name = "kafka-async-service"
version = "0.1.0"
description = "Production-like async Kafka consumer service with JSON logs and OpenTelemetry"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp>=1.26.0",
    "opentelemetry-instrumentation-logging>=0.47b0",
    "tenacity>=8.2.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
