[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hadoop-result-writer"
version = "0.1.0"
description = "Prototype of Kerberos-authenticated Parquet publication to HDFS and Hive"
requires-python = ">=3.12"
dependencies = ["pyarrow>=21,<24", "trino[gssapi]>=0.336,<0.340"]

[project.optional-dependencies]
pandas = ["pandas>=2.2,<4"]

[project.scripts]
hadoop-result-writer = "hadoop_result_writer.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pandas>=2.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/hadoop_result_writer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
