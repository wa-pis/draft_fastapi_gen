[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "async-postgres-client"
version = "0.1.0"
description = "Asynchronous client for the PostgreSQL NDJSON result API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/async_postgres_client"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-m", "not integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL writer HTTP service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
