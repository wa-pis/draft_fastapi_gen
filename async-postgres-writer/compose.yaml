services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: writer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stream_writer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writer -d stream_writer"]
      interval: 3s
      timeout: 3s
      retries: 20

  init-db:
    build: .
    image: async-postgres-writer:local
    command: ["init-db"]
    environment: &writer-environment
      WRITER_DATABASE_URL: postgresql://writer:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/stream_writer
      WRITER_API_TOKEN: ${WRITER_API_TOKEN:?Set WRITER_API_TOKEN in .env}
      WRITER_POOL_SIZE: ${WRITER_POOL_SIZE:-4}
      WRITER_MAX_UPLOAD_BYTES: ${WRITER_MAX_UPLOAD_BYTES:-5368709120}
      WRITER_MAX_LINE_BYTES: ${WRITER_MAX_LINE_BYTES:-1048576}
      WRITER_UPLOAD_TIMEOUT_SECONDS: ${WRITER_UPLOAD_TIMEOUT_SECONDS:-3600}
      WRITER_EXPORT_TIMEOUT_SECONDS: ${WRITER_EXPORT_TIMEOUT_SECONDS:-3600}
      WRITER_READ_TIMEOUT_SECONDS: ${WRITER_READ_TIMEOUT_SECONDS:-30}
      WRITER_ACQUIRE_TIMEOUT_SECONDS: ${WRITER_ACQUIRE_TIMEOUT_SECONDS:-5}
      WRITER_DB_COMMAND_TIMEOUT_SECONDS: ${WRITER_DB_COMMAND_TIMEOUT_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy

  writer:
    build: .
    image: async-postgres-writer:local
    environment: *writer-environment
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      init-db:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
